<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бортжурнал">

<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-column phone app — odometer header, scrolling list, fixed bottom tab bar; bottom sheets for editing */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#13181D; --muted:#5D6772; --line:#D8DEE4;
  --accent:#6E4B3A; --accent-ink:#FFFFFF; --accent-soft:#F1E9E4;
  --ok:#2C7A4B; --ok-soft:#E3F2E9; --warn:#A86A12; --warn-soft:#FBF0DC; --bad:#B8322A; --bad-soft:#FBE5E3;
  --odo:#1A1F24; --odo-ink:#F4F1EC;
  --f-body:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --surface:#1A1E22; --sunk:#14181B; --ink:#E9ECEF; --muted:#98A2AD; --line:#2A3036;
  --accent:#C9A08A; --accent-ink:#1A1310; --accent-soft:#2C231E;
  --ok:#5BC08A; --ok-soft:#16281E; --warn:#E3A94A; --warn-soft:#2D2414; --bad:#EF7A70; --bad-soft:#2F1A18;
  --odo:#050607; --odo-ink:#F4F1EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#1A1E22; --sunk:#14181B; --ink:#E9ECEF; --muted:#98A2AD; --line:#2A3036;
  --accent:#C9A08A; --accent-ink:#1A1310; --accent-soft:#2C231E;
  --ok:#5BC08A; --ok-soft:#16281E; --warn:#E3A94A; --warn-soft:#2D2414; --bad:#EF7A70; --bad-soft:#2F1A18;
  --odo:#050607; --odo-ink:#F4F1EC; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(156px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
/* header */
.top{padding-block:14px 6px;display:grid;gap:12px}
.carline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.carline h1{font:600 22px/1.1 var(--f-disp);letter-spacing:.01em;margin:0;text-wrap:balance}
.carline .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.odo{background:var(--odo);color:var(--odo-ink);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;text-align:left;width:100%}
.odo .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.digits{display:flex;gap:3px;margin-top:6px}
.digits span{font:500 28px/1 var(--f-mono);background:#2B3137;color:#F4F1EC;border-radius:5px;padding:6px 5px 5px;min-width:24px;text-align:center}
.digits span.k{background:transparent;padding-inline:2px;min-width:0;opacity:.6;font-size:16px;align-self:flex-end}
.odo .upd{font-size:12px;opacity:.7;text-align:right}
.odo .upd b{display:block;font-size:13px;opacity:1;color:#F4F1EC;font-weight:700}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chipstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left}
.chipstat b{font:600 20px/1 var(--f-disp);display:block}
.chipstat span{font-size:11.5px;color:var(--muted)}
.chipstat.bad b{color:var(--bad)} .chipstat.warn b{color:var(--warn)} .chipstat.ok b{color:var(--ok)}
/* sections */
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}
.sechead h2{font:600 18px/1.1 var(--f-disp);margin:0;letter-spacing:.02em;text-transform:uppercase}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.list{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.st-bad{border-left:4px solid var(--bad)} .card.st-warn{border-left:4px solid var(--warn)} .card.st-ok{border-left:4px solid var(--ok)} .card.st-none{border-left:4px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;min-width:0}
.title{font-weight:700;font-size:15px;line-height:1.3;min-width:0}
.meta{color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-none{background:var(--sunk);color:var(--muted);border:1px solid var(--line)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nums b{color:var(--ink);font-weight:700}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.body{font-size:13.5px;line-height:1.5;display:grid;gap:6px}
.body p{margin:0;white-space:pre-line}
.body .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{background:var(--sunk);border-radius:9px;padding:8px 10px;font-size:13px;white-space:pre-wrap;border:1px dashed var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.oem{font:500 13.5px var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:3px 7px;letter-spacing:.02em}
.oem.todo{color:var(--muted);font-family:var(--f-body);font-style:italic}
.catname{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 2px 2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}
.logitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.logdate{font:600 13px/1.2 var(--f-disp);text-align:center;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:6px 8px;min-width:58px}
.logdate small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.info{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:13.5px;display:grid;gap:4px}
.info b{color:var(--accent)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs .dot{position:absolute;top:3px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:16px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);justify-self:center}
.sheet h3{margin:0;font:600 19px/1.2 var(--f-disp);letter-spacing:.02em}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;width:100%;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetact{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.sheetact .grow{display:flex;gap:8px;margin-left:auto}
.btn.big{padding:11px 16px;font-size:15px;border-radius:11px}
.btn.danger{color:var(--bad);background:transparent;border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:30}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;margin-top:4px}
.now h3{margin:0;font:600 15px/1.2 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.now ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.now li{display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:center}
.now li span{color:var(--muted);font-size:12.5px;text-align:right}
.stage{position:relative;border-radius:var(--r);overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#3a4149 0%,#1d2126 55%,#121417 100%);border:0;padding:0;width:100%;display:block;text-align:left}
.stage svg{display:block;width:100%;height:auto}
.stage .tune{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.14);color:#F4F1EC;border:1px solid rgba(255,255,255,.22);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
.stage .cap{position:absolute;left:12px;top:11px;color:rgba(244,241,236,.75);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.stage img.photo{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.stage .tunes{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.stage .tunes .tune{position:static}
.opt{display:grid;gap:6px}
.opt .k{font-size:12px;font-weight:700;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#3a4149 0%,#1d2126 55%,#121417 100%);position:sticky;top:0;z-index:2}
.chooser{display:grid;gap:8px}
.chooser button{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px}
.chooser button b{display:block;font-size:15px}
.chooser button span{font-size:12.5px;color:var(--muted)}
.chooser .ic{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 20px var(--f-disp)}
.chooser button.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chooser button.main span{color:var(--accent-ink);opacity:.85}
.chooser button.main .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.receipt{width:100%;border-radius:10px;border:1px solid var(--line)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;justify-self:center}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.yrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.ybar{grid-column:1/-1;height:8px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex;border:1px solid var(--line)}
.ybar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

/* ===== modern skin ===== */
:root{--bg:#F1F2F4;--surface:#FFFFFF;--sunk:#F4F5F7;--line:#E3E6EA;--ink:#111418;--muted:#6B7480;
  --accent:#7A4E38;--accent-2:#B07A55;--accent-soft:#F4ECE6;--sh:0 1px 2px rgba(17,20,24,.04),0 10px 28px -12px rgba(17,20,24,.16);
  --f-disp:"Unbounded","Oswald","Arial Narrow",sans-serif;--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0C0E;--surface:#16181B;--sunk:#1E2125;--line:#262A2F;--ink:#EEF0F2;--muted:#959DA7;
  --accent:#D8AC8E;--accent-2:#BD8A68;--accent-soft:#2A211C;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0B0C0E;--surface:#16181B;--sunk:#1E2125;--line:#262A2F;--ink:#EEF0F2;--muted:#959DA7;
  --accent:#D8AC8E;--accent-2:#BD8A68;--accent-soft:#2A211C;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.7)}
body{background:var(--bg) radial-gradient(120% 40% at 50% -10%, var(--accent-soft), transparent 70%) no-repeat}
.top{padding-block:12px 4px;gap:10px}
.stage{border-radius:26px;box-shadow:0 18px 40px -20px rgba(0,0,0,.55)}
.stage img.photo{aspect-ratio:4/3;max-height:52vh}
.stage .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 50%,rgba(0,0,0,.78) 100%);pointer-events:none}
.stage .carline{position:absolute;left:16px;right:16px;bottom:14px;display:block;color:#fff}
.stage .carline h1{font:600 21px/1.15 var(--f-disp);letter-spacing:-.01em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.stage .carline .sub{color:rgba(255,255,255,.78);font-size:12.5px;margin-top:5px}
.stage .tunes{left:12px;right:12px;top:12px;justify-content:space-between}
.stage .tune{background:rgba(20,20,22,.38);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 13px;-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.odo{border-radius:22px;padding:14px 16px;background:linear-gradient(135deg,#1B1F24,#0E1013);box-shadow:var(--sh);border:1px solid rgba(255,255,255,.04)}
.digits span{background:linear-gradient(180deg,#2E343B,#1F2328);border-radius:7px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.odo .lbl{letter-spacing:.14em}
.sechead{margin:24px 0 12px}
.sechead h2{font:600 18px/1.15 var(--f-disp);text-transform:none;letter-spacing:-.01em}
.add{border-radius:999px;padding:8px 14px;background:var(--ink);color:var(--bg)}
.card{border:1px solid transparent;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;gap:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{border-color:var(--line)}}
:root[data-theme="dark"] .card{border-color:var(--line)}
.card.st-bad,.card.st-warn,.card.st-ok,.card.st-none{border-left:1px solid transparent;position:relative;padding-left:20px}
.card.st-bad::before,.card.st-warn::before,.card.st-ok::before,.card.st-none::before{content:"";position:absolute;left:8px;top:16px;bottom:16px;width:4px;border-radius:4px;background:var(--line)}
.card.st-bad::before{background:var(--bad)} .card.st-warn::before{background:var(--warn)} .card.st-ok::before{background:var(--ok)}
.title{font-weight:700;letter-spacing:-.005em}
.pill{padding:4px 10px;font-size:11.5px;letter-spacing:.01em}
.p-none{border:0;background:var(--sunk)}
.bar{height:5px;border:0;background:var(--sunk)}
.bar i{border-radius:5px}
.summary{gap:10px}
.chipstat{border:0;border-radius:18px;box-shadow:var(--sh);padding:12px}
.chipstat b{font:600 22px/1 var(--f-disp)}
.now{border:0;border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;background:linear-gradient(135deg,var(--surface),var(--accent-soft))}
.now h3{font:600 14px/1.2 var(--f-disp);text-transform:none;letter-spacing:0}
.btn{border:0;background:var(--sunk);border-radius:12px;padding:8px 12px;font-weight:700}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.filters button{border:0;background:var(--surface);box-shadow:var(--sh);padding:8px 14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{border:0;border-radius:14px;padding:4px}
.seg button{border-radius:10px}

/* ===== motion & polish ===== */
html{scroll-padding-top:16px;scroll-padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
button,.btn,a.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .2s,box-shadow .2s,color .2s}

.chipstat{text-align:left;cursor:pointer;font:inherit;color:inherit}
.chipstat[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent),var(--sh)}
.now li{display:block}
.nowbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;padding:8px 0;text-align:left;font:inherit;color:inherit;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}

.seg2 button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;color:var(--muted)}
.seg2 button small{font-weight:600;opacity:.7;margin-left:4px}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
.tabs button{isolation:isolate}
.tabs button::before{content:"";position:absolute;left:18%;right:18%;top:2px;height:34px;border-radius:12px;background:var(--accent-soft);z-index:-1;opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s cubic-bezier(.2,1.3,.4,1)}
.tabs button[aria-selected="true"]::before{opacity:1;transform:scale(1)}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:var(--sh)}25%{box-shadow:0 0 0 3px var(--accent),var(--sh)}}
@media (prefers-reduced-motion:no-preference){
  #view.enter :is(.summary > *,.now,.sechead,.filters,.seg2,.search,.catname,.card,.info,.backup,.empty){animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
  #view.enter .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms + .15s)}
  @keyframes grow{from{width:0}}
  .stage img.photo{animation:kb 1.8s cubic-bezier(.2,.8,.2,1) both}
  @keyframes kb{from{transform:scale(1.08);filter:saturate(.7) brightness(.85)}}
  .stage .carline{animation:rise .7s .25s cubic-bezier(.2,.8,.2,1) both}
  .digits span.roll{animation:roll .6s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--d) * 60ms)}
  @keyframes roll{from{transform:translateY(-70%);opacity:0}}
  .fab{animation:pop .5s .4s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .scrim{animation:fade .22s ease both}
  @keyframes fade{from{background:rgba(10,12,14,0)}}
  .sheet{animation:sheetup .38s cubic-bezier(.2,1.1,.3,1) both}
  @keyframes sheetup{from{transform:translateY(100%)}}
  .scrim.out{animation:fadeout .2s ease forwards}
  .scrim.out .sheet{animation:sheetdown .2s ease-in forwards}
  @keyframes fadeout{to{background:rgba(10,12,14,0)}}
  @keyframes sheetdown{to{transform:translateY(100%)}}
  .toast{animation:toast .28s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes toast{from{opacity:0;transform:translate(-50%,10px) scale(.96)}}
  .pill{transition:background-color .25s,color .25s}
  .seg button,.seg2 button,.filters button{transition:background-color .25s,color .25s,box-shadow .25s,transform .14s}
}

.prostrip.free{background:var(--surface);box-shadow:var(--sh)}
.backup.install{background:var(--accent-soft);border-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:0}
.lockcard{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 18px;background:var(--surface);border-radius:20px;box-shadow:var(--sh);margin-top:6px}
.lockcard h3{margin:0;font:650 18px/1.3 var(--f-disp);text-wrap:balance}
.lockcard p{margin:0}
.lockcard .lk{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.lockcard .lk svg{width:26px;height:26px}
.lockcard .btn.big{width:100%}
.teaser{width:100%;display:grid;gap:0;text-align:left;border-top:1px solid var(--line);margin:4px 0}
.teaser > div{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.masked{filter:blur(5px);user-select:none;-webkit-user-select:none;color:var(--accent);font-family:ui-monospace,monospace;white-space:nowrap}
.procard .feats{display:grid;margin:8px 0 4px}
.featrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.featrow .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.featrow .ti svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.featrow b{font-size:14px;font-weight:650;min-width:0}
.featrow small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pricebox{display:flex;align-items:end;justify-content:space-between;padding:12px 0 4px;border-top:1px solid var(--line)}
.pricebox .price{font:700 30px/1.1 var(--f-disp);color:var(--accent)}
.procard .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card.dev{border:1px dashed var(--line);box-shadow:none;background:transparent}
.card.dev .seg{margin-top:10px}
.teaser > div > span:first-child{min-width:0}
.teaser .masked{flex:none;max-width:45%;overflow:hidden;text-overflow:clip}
.lockcard{min-width:0;overflow:hidden}

/* ---------- fuel wheel ---------- */
.summary:has(.fuelchip){grid-template-columns:repeat(4,minmax(0,1fr))}
.fuelchip b{font-size:18px;white-space:nowrap}
.fuelchip span{white-space:nowrap}
.wheels{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:108px;background:var(--sunk);border-radius:14px;overflow:hidden}
.wheels::before{content:"";position:absolute;left:10px;right:10px;top:36px;height:36px;border-radius:10px;background:var(--surface);box-shadow:var(--sh);pointer-events:none}
.wheel{position:relative;z-index:1;height:108px;width:64px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wpad{height:36px}
.wi{height:36px;display:grid;place-items:center;scroll-snap-align:center;font:600 16px/1 var(--f-disp);color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer}
.wi.on{color:var(--ink);font-size:19px;font-weight:700}
.wunit{position:relative;z-index:1;font:600 16px/1 var(--f-disp);color:var(--muted)}
.fueltotal{font:700 22px/46px var(--f-disp);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- alignment pass ---------- */
.subhead{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding:10px max(16px, env(safe-area-inset-right,0px)) 12px;background:color-mix(in srgb, var(--bg) 86%, transparent)!important;-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.subhead + *{margin-top:4px}
.prostrip{margin:0 0 12px}
.backup.install{margin:0 0 12px}
.now{margin-bottom:12px}
.grid + .backup{margin-top:14px}
.oemline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-top:6px}
.oemline .oem{min-width:0;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.two{align-items:end}
.seg button{white-space:nowrap;padding-inline:4px}
.card.dev .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.summary{align-items:stretch}
.chipstat{min-width:0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sechead h3{min-width:0}
.odo{margin-bottom:12px}
.card .actions .btn,.card .actions a.btn{flex:1 1 auto;justify-content:center;text-align:center}
.card .actions .btn.pri{flex-grow:1.4}
.procard .actions{align-items:stretch}
.nowbtn{display:flex!important;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left}
.nowbtn .nm{flex:1 1 auto;min-width:0;text-align:left}
.nowbtn > span:last-child{flex:none;white-space:nowrap;text-align:right}

/* ---------- install gate ---------- */
.gated .fab,.gated .sync{display:none!important}
.gate{min-height:calc(100vh - 120px);display:grid;align-content:center;justify-items:center;text-align:center;gap:16px;padding-block:40px;max-width:420px;margin:0 auto}
.gate .gicon{width:84px;height:84px;border-radius:22px;box-shadow:var(--sh)}
.gate h1{margin:0;font:600 26px/1.1 var(--f-disp)}
.gate .glead{margin:0;color:var(--muted);font-size:15px}
.gsteps{list-style:none;counter-reset:g;margin:6px 0 0;padding:16px;display:grid;gap:14px;text-align:left;background:var(--surface);border-radius:20px;box-shadow:var(--sh);width:100%}
.gsteps li{counter-increment:g;position:relative;padding-left:42px;min-height:30px;padding-top:4px;font-size:15px;line-height:1.45}
.gsteps li::before{content:counter(g);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:10px;background:linear-gradient(140deg,var(--pri1),var(--pri2));color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.gate .ic{width:20px;height:20px;vertical-align:-4px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gate circle{fill:var(--accent);stroke:none}
.gstep{display:grid;gap:12px;background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:16px;width:100%}
.gstep p{margin:0;font-size:15px}
.gurl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.gurl code{font:500 13px/1.4 var(--f-mono);background:var(--sunk);padding:8px 10px;border-radius:10px;overflow-wrap:anywhere;user-select:all}
.gate .btn.big{width:100%}
.gdone{color:var(--ok);font-weight:700;margin:0}
.glink{color:var(--accent);font-weight:700;text-decoration:none;margin-top:6px}

/* закрытый доступ: поле кода */
.gate .gcode{display:flex;gap:10px;width:100%;max-width:360px;margin:6px auto 0}
.gate .gcode input{flex:1 1 auto;min-width:0;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.gate .gcode input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate .gcode .btn{flex:none;width:auto;padding-inline:20px}
.gate .gerr{color:var(--bad);font-size:14px;margin:4px 0 0}

</style>
</head>

function buildCar(cfg){

    else { part('p_haldex','to','Трансмиссия','Масло муфты Haldex','G 060 175 A2','Оригинал','около 0,6 л',''); part('p_rdiff','to','Трансмиссия','Масло заднего редуктора','G 052 145 S2', 'Гипоидное 75W-90 с допуском VW', 'около 0,9 л', 'Сверить по коду редуктора.'); }

      if (e.egr) S('egr','Клапан EGR: проверка и чистка', 60000, 48, 'По состоянию: провалы тяги, ошибки.', ['r_egr']);

  ]);
  return { svc, parts, issues };
}

<script>
/* ================= ETKA equipment sheet (PDF by VIN) ================= */
const EQUIP = (() => {
  const PDFJS = './';
  let loading = null;
  function loadPdfJs(){
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return loading || (loading = new Promise((ok, bad) => {
      const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
      s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); } catch(e) { bad(e); } };
      s.onerror = () => { loading = null; bad(new Error('pdfjs')); }; document.head.appendChild(s);
    }));
  }
  /* rows of positioned text per page */
  async function pdfRows(buf, lib){
    lib = lib || await loadPdfJs();
    const doc = await lib.getDocument({ data: buf, isEvalSupported:false }).promise, pages = [];
    for (let n = 1; n <= doc.numPages; n++) {
      const pg = await doc.getPage(n), tc = await pg.getTextContent(), rows = [];
      tc.items.forEach(it => { const s = it.str; if (!s || !s.trim()) return; const x = it.transform[4], y = it.transform[5];
        let r = rows.find(r => Math.abs(r.y - y) < 2.2); if (!r) { r = { y, items:[] }; rows.push(r); } r.items.push({ x, s }); });
      rows.sort((a,b) => b.y - a.y); rows.forEach(r => r.items.sort((a,b) => a.x - b.x));
      pages.push(rows);
    }
    return pages;
  }
  const join = items => items.map(i => i.s).join(' ').replace(/\s+/g,' ').trim();
  function parse(pages){
    const head = {}, pr = [];
    let valueX = null, inPr = false;
    pages.forEach(rows => {
      if (valueX == null) { const r = rows.find(r => r.items[0] && /^VIN$/i.test(r.items[0].s.trim())); if (r && r.items[1]) valueX = r.items[1].x; }
      if (valueX == null) return;
      const lines = [];
      rows.forEach(r => {
        const L = r.items.filter(i => i.x < valueX - 4), R = r.items.filter(i => i.x >= valueX - 4);
        const lt = join(L), rt = join(R);
        if (/^PR:?$/.test(lt) && !rt) { inPr = true; return; }
        if (!inPr) { if (lt && rt) head[lt] = rt; return; }
        let code = null, rest = rt;
        const first = R[0];
        if (first && Math.abs(first.x - valueX) < 6) { const m = rt.match(/^([0-9A-Z]{3})(?:\s+(.*))?$/); if (m) { code = m[1]; rest = m[2] || ''; } }
        lines.push({ y:r.y, lt, rt:rest, code });
      });
      const codes = lines.filter(l => l.code);
      if (!codes.length) return;
      const ent = codes.map(c => ({ code:c.code, y:c.y, label:[], text:[] }));
      lines.forEach(l => { let best = ent[0], bd = Infinity; ent.forEach(e => { const d = Math.abs(e.y - l.y); if (d < bd) { bd = d; best = e; } });
        if (l.lt) best.label.push([l.y, l.lt]); if (l.rt) best.text.push([l.y, l.rt]); });
      ent.forEach(e => pr.push({ code:e.code, group: e.label.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).join(' ').trim(), text: e.text.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).join(' ').trim() }));
    });
    const h = k => { const key = Object.keys(head).find(x => x.toLowerCase().startsWith(k.toLowerCase())); return key ? head[key] : ''; };
    const vinM = (h('VIN') || '').match(/[A-HJ-NPR-Z0-9]{17}/);
    return { vin: vinM ? vinM[0] : '', model: h('Модель'), trade: h('Торг'), engineCode: (h('Код двигателя').match(/[A-Z0-9]{3,4}/)||[''])[0], gbCode: (h('Код КП').match(/[A-Z0-9]{3}/)||[''])[0],
      date: h('Дата производства'), my: (h('Модельный год').match(/\d{4}/)||[''])[0], paint: h('Наружная краска'), pr };
  }
  /* ---------- mapping to knowledge base ---------- */
  const VINMAP = { '8P':'a3_8p','8V':'a3_8v','GY':'a3_8y','8K':'a4_b8','8T':'a4_b8','8F':'a4_b8','8W':'a4_b9','F5':'a4_b9','4G':'a6_c7','4K':'a6_c8','F2':'a6_c8','8U':'q3_8u','F3':'q3_f3','8R':'q5_8r','FY':'q5_fy','4L':'q7_4l','4M':'q7_4m',
    '1K':'golf_1k','5K':'golf6','AJ':'golf6','6R':'polo_6r','AW':'polo_aw','1T':'touran1','5T':'touran2','7N':'sharan2','BU':'jetta7','A1':'troc','C1':'tcross','3H':'arteon','2H':'amarok','8X':'a1_8x','GB':'a1_gb','GA':'q2','4H':'a8_d4','NW':'scala_kamiq','6J':'ibiza4','KJ':'ibiza_arona','KN':'tarraco','KM':'formentor','KL':'leon4','AU':'golf7','5G':'golf7','BA':'golf7','CD':'golf8','16':'jetta6','3C':'passat','36':'passat_b7','3G':'passat_b8','5N':'tiguan1','AD':'tiguan2','BW':'tiguan2','7P':'touareg_nf','CR':'touareg_cr','CA':'teramont','2K':'caddy','SA':'caddy','7H':'t5','7E':'t5','SG':'t6','SH':'t6','7J':'t5',
    '61':'polo','CK':'polo_lb','1Z':'octavia_a5','5E':'octavia_a7','NX':'octavia_a8','NH':'rapid','3T':'superb_b6','3V':'superb_b8','5L':'yeti','NS':'kodiaq','NU':'karoq','5J':'fabia','NJ':'fabia','1P':'leon2','5F':'leon3','KH':'ateca' };
  const YEAR = 'ABCDEFGHJKLMNPRSTVWXY123456789';
  const vinYear = v => { const c = (v||'')[9]; const i = YEAR.indexOf(c); return i < 0 ? null : 2010 + i - (i >= 21 ? 30 : 0); };
  function toCfg(eq){
    const out = { cfg:{ brand:'', model:'', engine:'', gearbox:'', drive:'fwd', air:false }, found:{}, year: eq.my || '', vin: eq.vin || '' };
    const all = eq.pr.map(p => p.code+' '+p.group+' '+p.text).join('\n'), year = Number(eq.my) || vinYear(eq.vin) || 0;
    /* model */
    let mid = VINMAP[(eq.vin||'').slice(6,8)] || '';
    if (mid==='passat') mid = year && year >= 2011 ? 'passat_b7' : 'passat_b6';
    if (mid==='polo') mid = year >= 2020 ? 'polo_lb' : 'polo_sedan';
    if (mid==='rapid') mid = year >= 2020 ? 'rapid2' : 'rapid';
    if (mid==='t5' && year >= 2016) mid = 't6';
    if (mid==='golf_1k') mid = year && year <= 2008 ? 'golf5' : 'golf6';
    if (mid==='scala_kamiq') mid = /kamiq/i.test(eq.model||'') ? 'kamiq' : 'scala';
    if (mid==='ibiza_arona') mid = /arona/i.test(eq.model||'') ? 'arona' : 'ibiza5';
    if (!mid) { const t = (eq.model||'').toLowerCase();
      const cand = Object.values(KB.M).filter(m => m.id!=='other' && t.includes(m.name.toLowerCase().split(/[ /]/)[0].toLowerCase()));
      const fit = cand.filter(m => { const ys = m.years.match(/\d{4}/g)||[]; const a = +ys[0]||0, b = m.years.includes('+') ? 9999 : (+ys[1]||9999); return !year || (year >= a && year <= b+1); });
      if (fit.length === 1) mid = fit[0].id; }
    if (mid && KB.M[mid]) { out.cfg.model = mid; out.cfg.brand = KB.M[mid].brand; out.found.model = true; }
    else { const t = (eq.model||'').toLowerCase(); out.cfg.brand = /audi/.test(t)?'audi':/skoda|škoda/.test(t)?'skoda':/cupra/.test(t)?'cupra':/seat/.test(t)?'seat':/vw|volkswagen|polo|golf|passat|tiguan|touareg|jetta/.test(t)?'vw':''; }
    /* engine */
    if (eq.engineCode) { const e = Object.entries(KB.E).find(([id,x]) => x.codes.split(/,\s*/).includes(eq.engineCode)); if (e) { out.cfg.engine = e[0]; out.found.engine = true; } }
    /* gearbox */
    const m = KB.M[out.cfg.model], plat = m ? m.platform : '', longi = ['mlb','mlbevo','pl71'].includes(plat);
    const gbLine = (eq.pr.find(p => /Спецификации КП|КП/.test(p.group) && /ступ/.test(p.text)) || {}).text || '';
    let g = '';
    if (/DQ\s?200/i.test(all)) g = 'dq200'; else if (/DQ\s?250/i.test(all)) g = 'dq250'; else if (/DQ\s?381/i.test(all)) g = 'dq381'; else if (/DQ\s?500/i.test(all)) g = 'dq500';
    else if (/DL\s?501/i.test(all)) g = 'dl501'; else if (/DL\s?382/i.test(all)) g = 'dl382';
    else if (/бесступ|multitronic|вариатор/i.test(all)) g = 'multitronic';
    else if (/МКП|механическ/i.test(gbLine)) g = 'manual';
    else if (/8-ступ/i.test(gbLine)) g = longi ? 'at8_long' : 'at8_trans';
    else if (/6-ступ/i.test(gbLine)) g = /двойн|DSG/i.test(gbLine) ? 'dq250' : plat==='pl71' ? 'at6_long' : 'aisin6';
    else if (/7-ступ/i.test(gbLine)) g = plat==='mlbevo' ? 'dl382' : plat==='mlb' ? 'dl501' : '';
    if (g && KB.G[g]) { out.cfg.gearbox = g; out.found.gearbox = true; }
    /* drive & air */
    const drv = eq.pr.find(p => /^1X\d$/.test(p.code) || /Тип привода/.test(p.group));
    if (drv) { out.found.drive = true; out.cfg.drive = /полный|quattro|4motion|4x4/i.test(drv.text) || /^1X[1-9]$/.test(drv.code) ? 'awd' : 'fwd'; }
    else if (m && m.drive !== 'opt') out.cfg.drive = m.drive === 'fwd' ? 'fwd' : 'awd';
    if (m && m.drive !== 'opt' && m.drive !== 'fwd') out.cfg.drive = 'awd';
    out.cfg.air = /пневмоподвеск|пневматическ[а-я]* подвеск/i.test(all) || (m && m.air === true);
    return out;
  }
  /* hints for parts and notes */
  function hints(eq){
    const pr = code => eq.pr.find(p => p.code === code), grp = re => eq.pr.find(p => re.test(p.group));
    const tyre = grp(/^Шины$/), bat = grp(/^Батаре/), bf = grp(/Тормоза передние/), br = grp(/Тормоза задние/), wheels = grp(/^Колёса/), fuel = grp(/Качество топлива/), cool = grp(/Охлаждение двигателя/), cabin = grp(/Впуск приточного воздуха/), ss = eq.pr.find(p => /старт-стоп/i.test(p.text)), gen = grp(/^Генератор/), lights = grp(/Фары головного света/), susp = grp(/подвеск|амортиз|ходов/i);
    return { tyre: tyre && (tyre.text.match(/\d{3}\/\d{2}\s?Z?R\s?\d{2}[^,;]*/)||[tyre.text])[0].trim(), tyreCode: tyre && tyre.code,
      battery: bat && bat.text, batteryCode: bat && bat.code, brakesF: bf && `${bf.code} — ${bf.text}`, brakesR: br && `${br.code} — ${br.text}`,
      wheels: wheels && wheels.text, fuel: fuel && fuel.text, cooling: cool && `${cool.code} — ${cool.text}`, cabin: cabin && `${cabin.code} — ${cabin.text}`,
      startStop: !!(ss && !/без/i.test(ss.text)), alternator: gen && gen.text, lights: lights && lights.text, susp: susp && `${susp.code} — ${susp.text}`, rhd: !!pr('L0R') || eq.pr.some(p => /правым расположением руля|правым расположением рулевого/i.test(p.text)) };
  }
  return { loadPdfJs, pdfRows, parse, toCfg, hints, vinYear };
})();

<script>
(() => {
/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n==null||n==='')?'—':Number(n).toLocaleString('ru-RU');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => iso(new Date());
const pl = (n, a, b, c) => { const m10 = n%10, m100 = n%100; return n+' '+(m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<12||m100>14)?b:c); };
const dRu = d => d ? new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'}) : '—';

const norm = s => String(s||'').toLowerCase().replace(/ё/g,'е');
const partLabel = p => p.oem ? `${p.name} · ${p.oem}` : p.name;
/* universal searchable picker */
function picker({ title, groups, multi = true, selected = [], freeLabel, onDone, doneLabel = 'Готово' }){
  const sel = new Set(selected);
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet picker"><div class="grab"></div><h3>${esc(title)}</h3>
    <input class="search pk-q" type="search" autocomplete="off" placeholder="Быстрый поиск">
    <div class="pk-list"></div>
    <div class="pk-bar"><button type="button" class="btn big" data-x="cancel">Отмена</button><button type="button" class="btn big pri" data-x="done">${esc(doneLabel)}</button></div></div>`;
  document.body.appendChild(scrim);
  const q = scrim.querySelector('.pk-q'), list = scrim.querySelector('.pk-list'), doneBtn = scrim.querySelector('[data-x="done"]');
  const draw = () => {
    const t = norm(q.value.trim());
    let out = '';
    if (t && freeLabel) out += `<button type="button" class="pk-item pk-free" data-free="1"><span class="pk-ck">＋</span><span><b>${esc(freeLabel)} «${esc(q.value.trim())}»</b></span></button>`;
    groups.forEach(g => {
      const items = g.items.filter(it => !t || norm(it.label+' '+(it.sub||'')+' '+(it.keys||'')).includes(t));
      if (!items.length) return;
      out += `<div class="catname">${esc(g.name)}</div>` + items.map(it => `<button type="button" class="pk-item" data-id="${esc(it.id)}" aria-pressed="${sel.has(it.id)}">
        <span class="pk-ck">${sel.has(it.id)?'✓':''}</span><span class="pk-tx"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span>${it.badge?`<span class="pill ${it.badgeCls||'p-none'}">${esc(it.badge)}</span>`:''}</button>`).join('');
    });
    list.innerHTML = out || `<div class="empty">Ничего не найдено${freeLabel?'':'. Измените запрос.'}</div>`;
    doneBtn.textContent = multi && sel.size ? `${doneLabel} (${sel.size})` : doneLabel;
    doneBtn.disabled = multi ? false : true;
    if (multi) doneBtn.hidden = false; else doneBtn.hidden = true;
  };
  q.addEventListener('input', draw);
  scrim.addEventListener('click', e => {
    if (e.target===scrim) return closeScrim(scrim);
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.x==='cancel') return closeScrim(scrim);
    if (b.dataset.x==='done') { closeScrim(scrim); onDone([...sel], ''); return; }
    if (b.dataset.free) { closeScrim(scrim); onDone([...sel], q.value.trim()); return; }
    if (b.dataset.id) {
      if (!multi) { closeScrim(scrim); onDone([b.dataset.id], ''); return; }
      sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id);
      const on = sel.has(b.dataset.id); b.setAttribute('aria-pressed', on); b.querySelector('.pk-ck').textContent = on ? '✓' : '';
      doneBtn.textContent = sel.size ? `${doneLabel} (${sel.size})` : doneLabel;
    }
  });
  draw();
  if (!('ontouchstart' in window)) q.focus();
}
/* ---------- sheets ---------- */
function sheet(title, fields, onSave, onDelete){
  const scrim = document.createElement('div'); scrim.className = 'scrim';

function decodeCode(raw){
  let c = String(raw||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if (!c) return null;
  let from = '';
  if (/^\d+$/.test(c)) {                       // VAG numeric code as shown by VCDS / vdApp
    if (c.length < 5) return { ok:false, typing:true, msg:'Продолжайте ввод: код VAG из 5 цифр или код вида P0301.' };
    const n = parseInt(c.slice(0,5), 10);
    if (n >= 16384 && n <= 17383) { from = c.slice(0,5); c = 'P0' + String(n - 16384).padStart(3,'0'); }
    else if (n >= 17408 && n <= 18407) { from = c.slice(0,5); c = 'P' + String(n - 16408); }
    else return { ok:true, code:c.slice(0,6), text:'', exact:false, msg:`Внутренний код VAG ${c.slice(0,6)}. Общей расшифровки для него нет: перепишите описание с экрана vdApp.` };
  }
  const m = c.match(/^([PCBU])([0-3])([0-9A-F]{3})/);
  if (!m) return /^[PCBU][0-9A-F]{0,3}$/.test(c)
    ? { ok:false, typing:true, msg:'Продолжайте ввод: после буквы нужно 4 знака, например P0301.' }
    : { ok:false, msg:'Такого формата не бывает. Код ошибки: буква P, C, B или U и 4 знака (P0301) либо 5 цифр VAG (16684).' };
  const code = m[0], pre = from ? `VAG ${from} = ` : '';
  if (PCODES[code]) return { ok:true, code, text:PCODES[code], exact:true, pre };
  const sys = { P:'двигатель и КПП', C:'шасси (тормоза, подвеска, рулевое)', B:'кузов и салон', U:'сеть связи между блоками' }[m[1]];
  let group = '';
  if (m[1]==='P' && m[2]==='0') group = ({'0':'топливо, воздух и фазы','1':'топливо и воздух (датчики)','2':'топливо и воздух (форсунки, наддув)','3':'зажигание и пропуски','4':'экология и выхлоп','5':'скорость, холостой ход, бортсеть','6':'блок управления','7':'трансмиссия','8':'трансмиссия','9':'трансмиссия'})[m[3][0]]||'';
  const maker = (m[2]==='1' || m[2]==='3') ? 'код производителя VAG' : 'общий код';
  return { ok:true, code, text:'', exact:false, msg:`${pre}${code}: ${maker}, система «${sys}»${group?', группа «'+group+'»':''}. Точной расшифровки в справочнике нет: перепишите описание с экрана vdApp.` };
}

    case 'drive': return 'по кодам раздатки и редукторов';
    case 'pr_brake': return H && H.brakesF ? 'по PR-коду ' + prc(H.brakesF) : 'по PR-коду тормозов';
    case 'pr_brakeR': return H && H.brakesR ? 'по PR-коду ' + prc(H.brakesR) : 'по PR-коду задних тормозов';
    case 'pr_batt': return H && H.batteryCode ? 'по PR-коду ' + H.batteryCode : 'по PR-коду АКБ';
    case 'pr_susp': return H && H.susp ? 'по PR-коду ' + prc(H.susp) : 'по PR-коду подвески';
    case 'pr_tyre': return 'по табличке в проёме двери';

    default: return 'по VIN';

function parts(){ const c = car(); if (!c) return []; const H = equipHints(c);
  return kbData().parts.map(p => ({ ...applyHints(p, H), ...(c.partOv[p.id]||{}), state:(c.partSt[p.id]||'none'), kb:true })).concat(c.customParts.map(p => ({ ...p, state:(c.partSt[p.id]||p.state||'none') }))); }
function issues(){ const c = car(); if (!c) return [];

  return kbData().issues.concat(extra).map(i => ({ ...i, ...(c.iss[i.id]||{}), kb:true })).concat(c.customIss.map(i => ({ ...i, ...(c.iss[i.id]||{}), kind:'mine' }))); }

  return [e && e.name, g && g.name, c.cfg.drive==='awd' ? 'полный привод' : '', c.year].filter(Boolean).join(' · '); }

/* ---------- statuses ---------- */
function addMonths(d, m){ const x = new Date(d+'T00:00:00'); x.setMonth(x.getMonth()+Number(m)); return x; }
function svcStatus(it){
  const km = mileage();
  const hasKm = it.kmInt && it.lastKm!=null && it.lastKm!=='';
  const hasDate = it.moInt && it.lastDate;
  if (!hasKm && !hasDate) return { st:'none', label:'Нет данных', frac:0, when:'' };
  let leftKm = null, leftDays = null, frac = 0;
  if (hasKm) { leftKm = Number(it.lastKm) + Number(it.kmInt) - km; frac = Math.max(frac, (km - it.lastKm)/it.kmInt); }
  if (hasDate) { const nd = addMonths(it.lastDate, it.moInt); leftDays = Math.round((nd - new Date())/864e5); frac = Math.max(frac, 1 - leftDays/(it.moInt*30.4)); }
  const over = (leftKm!=null && leftKm<0) || (leftDays!=null && leftDays<0);
  const soon = (leftKm!=null && leftKm<1500) || (leftDays!=null && leftDays<45);
  const w = [];
  if (leftKm!=null) w.push(leftKm<0 ? `просрочено на ${fmt(-leftKm)} км` : `через ${fmt(leftKm)} км`);
  if (leftDays!=null) w.push(leftDays<0 ? `просрочено на ${Math.round(-leftDays/30.4)||1} мес` : `через ${leftDays<60?leftDays+' дн':Math.round(leftDays/30.4)+' мес'}`);
  return { st: over?'bad':soon?'warn':'ok', label: over?'Просрочено':soon?'Скоро':'В норме', when: w.join(' · '), frac: Math.min(1, Math.max(0, frac)) };
}
const stPill = { bad:'p-bad', warn:'p-warn', ok:'p-ok', none:'p-none' };
function docStatus(d){
  if (!d.until) return { st:'none', label:'Укажите дату', when:'' };
  const days = Math.round((new Date(d.until+'T00:00:00') - new Date())/864e5);
  const st = days<0?'bad':days<=(Number(d.warnDays)||14)?'warn':'ok';
  return { st, label: days<0?'Просрочено':st==='warn'?'Скоро':'Действует', when: days<0?`просрочено на ${-days} дн`:`осталось ${days<60?days+' дн':Math.round(days/30.4)+' мес'}` };
}
function fuelStats(){
  const list = [...car().fuel].filter(f=>f.km).sort((a,b)=>a.km-b.km);
  const res = {}; let lastFull = null, acc = 0, sumL = 0, sumKm = 0;
  list.forEach(f => { if (lastFull) { acc += Number(f.liters)||0; if (f.full!=='no') { const dist = f.km - lastFull.km; if (dist>0) { res[f.id] = acc/dist*100; sumL += acc; sumKm += dist; } acc = 0; lastFull = f; } } else if (f.full!=='no') lastFull = f; });
  return { per:res, avg: sumKm ? sumL/sumKm*100 : null };
}

/* ---------- fuel ---------- */
const FUEL_TYPES = ['АИ-92','АИ-95','АИ-98','АИ-100','ДТ','Газ'];
function defFuelType(c){ const e = KB.E[c.cfg.engine]; return e && e.fuel==='d' ? 'ДТ' : 'АИ-95'; }
const priceRu = v => Number(v).toLocaleString('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 });
const money = v => priceRu(v).replace(/,00$/,'') + ' ₽';
const numIn = v => { const n = parseFloat(String(v ?? '').replace(',','.')); return n > 0 ? n : 0; };
function fuelChip(){ const c = car(), ft = c.fuelType || defFuelType(c);
  return `<button class="chipstat fuelchip" data-act="fuelSetup" aria-label="Тип топлива и цена за литр"><b>${esc(ft)}</b><span>${c.fuelPrice ? priceRu(c.fuelPrice)+' ₽/л' : 'цена?'}</span></button>`; }
function fuelSetup(then){ const c = car();
  sheet('Топливо', [{name:'type',label:'Что заливаете',type:'select',value:c.fuelType||defFuelType(c),options:FUEL_TYPES.map(x=>[x,x])},{name:'price',label:'Цена за литр, ₽',value:c.fuelPrice?priceRu(c.fuelPrice):'',ph:'например 62,40'}], d => {
    const pr = numIn(d.price); if (!pr) { toast('Укажите цену за литр'); return false; }
    c.fuelType = d.type; c.fuelPrice = pr; c.fuelPriceDate = today(); save(); render(); toast('Цена топлива обновлена'); if (then) setTimeout(then, 250); });
  const el = document.getElementById('f_price'); if (el) el.setAttribute('inputmode','decimal'); }
function fuelSheet(f, exists){ const c = car();
  const H2 = 36, val = { L: Math.min(120, Math.round(Number(f.liters) || 40)) };
  const W = (k, from, to) => `<div class="wheel" data-w="${k}" data-from="${from}"><div class="wpad"></div>${Array.from({length:to-from+1}, (_,i) => `<div class="wi">${from+i}</div>`).join('')}<div class="wpad"></div></div>`;
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<form class="sheet" novalidate><div class="grab"></div><h3>${exists?'Заправка':'Новая заправка'}</h3>
    <div class="two">${fieldHtml({name:'date',label:'Дата',type:'date',value:f.date})}${fieldHtml({name:'km',label:'Пробег, км',type:'number',value:f.km})}</div>
    <div class="field"><label>Залито, литров</label><div class="wheels">${W('L',1,120)}<span class="wunit">л</span></div></div>
    <div class="two">${fieldHtml({name:'price',label:`${f.fuelType||c.fuelType||defFuelType(c)}, ₽ за литр`,value:(f.price||c.fuelPrice)?priceRu(f.price||c.fuelPrice):''})}<div class="field"><label>Сумма</label><div class="fueltotal" id="fTotal">—</div></div></div>
    <div class="two">${fieldHtml({name:'full',label:'Бак',type:'select',value:f.full,options:[['yes','Полный, до отсечки'],['no','Не полный']]})}${fieldHtml({name:'station',label:'АЗС',value:f.station})}</div>
    <div class="sheetact">${exists?'<button type="button" class="btn big danger" data-x="del">Удалить</button>':''}<div class="grow"><button type="button" class="btn big" data-x="cancel">Отмена</button><button type="submit" class="btn big pri">Сохранить</button></div></div></form>`;
  document.body.appendChild(scrim);
  const form = scrim.querySelector('form'), close = () => closeScrim(scrim), pr = form.elements['price'];
  pr.setAttribute('inputmode','decimal');
  const liters = () => val.L, H = H2;
  const upd = () => { const p = numIn(pr.value); scrim.querySelector('#fTotal').textContent = p && liters() ? money(Math.round(liters() * p * 100) / 100) : '—'; };
  form.querySelectorAll('.wheel').forEach(w => { const k = w.dataset.w, from = Number(w.dataset.from), items = [...w.querySelectorAll('.wi')];
    const mark = () => { const i = Math.max(0, Math.min(items.length - 1, Math.round(w.scrollTop / H))); items.forEach((it, j) => it.classList.toggle('on', j === i)); val[k] = from + i; upd(); };
    requestAnimationFrame(() => { w.scrollTop = (val[k] - from) * H; mark(); });
    let raf; w.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(mark); }, { passive:true });
    items.forEach((it, j) => it.addEventListener('click', () => w.scrollTo({ top:j * H, behavior:'smooth' }))); });
  pr.addEventListener('input', upd);
  scrim.addEventListener('click', e => { if (e.target === scrim) close(); });
  form.querySelector('[data-x="cancel"]').onclick = close;
  const del = form.querySelector('[data-x="del"]');
  if (del) del.onclick = () => { if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Точно удалить?'; return; } c.fuel = c.fuel.filter(y => y.id !== f.id); save(); render(); toast('Удалено'); close(); };
  form.onsubmit = e => { e.preventDefault();
    const L = liters(), p = numIn(pr.value), kmv = form.elements['km'].value;
    if (!L) { toast('Прокрутите и выберите, сколько литров залито'); return; }
    if (!p) { toast('Укажите цену за литр'); pr.focus(); return; }
    const x = { date:form.elements['date'].value || today(), km:kmv === '' ? null : Number(kmv), liters:L, price:p, cost:Math.round(L * p * 100) / 100, full:form.elements['full'].value, station:form.elements['station'].value.trim(), fuelType:f.fuelType || c.fuelType || defFuelType(c) };
    if (p !== c.fuelPrice && x.date >= (c.fuelPriceDate || '')) { c.fuelPrice = p; c.fuelPriceDate = x.date; }
    const k = c.fuel.findIndex(y => y.id === f.id); if (k < 0) c.fuel.push({ ...f, ...x }); else c.fuel[k] = { ...f, ...x };
    if (x.km && x.km > mileage()) { c.mileage = x.km; c.mileageDate = today(); }
    save(); render(); toast('Заправка записана: ' + money(x.cost)); close(); };
}

function vMoney(){
  const c = car(), cats = [['ТО','var(--accent)'],['Ремонт','var(--bad)'],['Запчасти','var(--warn)'],['Топливо','var(--ok)'],['Прочее','var(--muted)']], years = {};
  const add = (date, cat, v) => { if (!v) return; const y = (date||'').slice(0,4) || 'без даты'; years[y] = years[y]||{}; years[y][cat] = (years[y][cat]||0)+Number(v); };
  c.log.forEach(x => add(x.date, cats.some(k=>k[0]===x.cat)?x.cat:'Прочее', x.cost)); c.fuel.forEach(f => add(f.date,'Топливо',f.cost));
  const ys = Object.keys(years).sort().reverse();
  let h = `<div class="legend" style="margin-top:6px">${cats.map(([n,col])=>`<span><i style="background:${col}"></i>${n}</span>`).join('')}</div>`;
  if (!ys.length) return h + `<div class="empty" style="margin-top:10px">Расходы посчитаются сами из журнала и заправок, когда в записях будет стоимость.</div>`;
  return h + '<div class="list" style="margin-top:10px">' + ys.map(y => { const t = Object.values(years[y]).reduce((a,b)=>a+b,0);
    return `<article class="card"><div class="yrow"><div class="title">${esc(y)}</div><b style="font-variant-numeric:tabular-nums">${fmt(Math.round(t))} ₽</b>
      <div class="ybar">${cats.map(([n,col])=>years[y][n]?`<i style="width:${years[y][n]/t*100}%;background:${col}"></i>`:'').join('')}</div></div>
      <div class="nums">${cats.filter(([n])=>years[y][n]).map(([n])=>`<span>${n} <b>${fmt(Math.round(years[y][n]))} ₽</b></span>`).join('')}</div></article>`; }).join('') + '</div>';
}

/* ---------- reminders (iPhone Calendar) ---------- */
function kmPerMonth(c){
  c = c || car(); if (c.kmMonth) return Number(c.kmMonth);
  const pts = [...c.log, ...c.fuel].filter(x=>x.km && x.date).map(x=>({ km:Number(x.km), d:new Date(x.date+'T00:00:00') }));
  if (c.mileage && c.mileageDate) pts.push({ km:Number(c.mileage), d:new Date(c.mileageDate+'T00:00:00') });
  pts.sort((a,b)=>a.d-b.d);
  if (pts.length >= 2) { const a = pts[0], b = pts[pts.length-1], months = (b.d - a.d)/864e5/30.4; if (months >= 1 && b.km > a.km) return Math.round((b.km - a.km)/months/100)*100 || 1500; }
  return 1500;
}
function upcoming(){
  const c = car(), kpm = kmPerMonth(c), now = new Date(), out = [], km = mileage();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  services().forEach(s => {
    let dates = [];
    if (s.moInt && s.lastDate) dates.push(addMonths(s.lastDate, s.moInt));
    if (s.kmInt && s.lastKm!=null && s.lastKm!=='') { const left = Number(s.lastKm) + Number(s.kmInt) - km; dates.push(new Date(now.getTime() + left / (kpm/30.4) * 864e5)); }
    if (!dates.length) return;
    let d = new Date(Math.min(...dates.map(x=>x.getTime()))); const over = d < tomorrow; if (over) d = tomorrow;
    const nk = s.kmInt && s.lastKm!=null && s.lastKm!=='' ? Number(s.lastKm) + Number(s.kmInt) : null;
    const ps = (s.parts||[]).map(findPart).filter(Boolean);
    out.push({ uid:`${c.id}-svc-${s.id}`, date:iso(d), title:`ТО: ${s.name}${over?' (просрочено)':''}`, sub: nk ? `при пробеге ${fmt(nk)} км или раньше` : 'по сроку',
      desc:`${carTitle()}.${nk?` Плановый пробег: ${fmt(nk)} км.`:''}${s.note?' '+s.note:''}${ps.length?' Запчасти: '+ps.map(p=>p.name+(p.oem?' '+p.oem:'')).join('; ')+'.':''}` });
  });
  c.docs.forEach(d0 => { if (!d0.until) return; let d = new Date(d0.until+'T00:00:00'); const over = d < tomorrow; if (over) d = tomorrow;
    out.push({ uid:`${c.id}-doc-${d0.id}`, date:iso(d), title:`${d0.name}: ${over?'просрочено':'заканчивается срок'}`, sub:'документ', desc:`${carTitle()}. ${d0.name} действует до ${dRu(d0.until)}.`, warn:Number(d0.warnDays)||14 }); });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ const enc = new TextEncoder(); if (enc.encode(line).length <= 74) return line; let out = '', cur = '';
  for (const ch of line) { if (enc.encode(cur + ch).length > 73) { out += (out ? '\r\n ' : '') + cur; cur = ch; } else cur += ch; } return out + (out ? '\r\n ' : '') + cur; }
function buildIcs(events, warnDays, monthly){
  const st = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), d8 = s => s.replace(/-/g,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bortzhurnal VAG//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Бортжурнал'];
  const ev = (uid, date, title, desc, warn, extra) => { const n = new Date(date+'T00:00:00'); n.setDate(n.getDate()+1);
    L.push('BEGIN:VEVENT','UID:'+uid+'@bortzhurnal','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+d8(date),'DTEND;VALUE=DATE:'+d8(iso(n)),'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),'TRANSP:TRANSPARENT', ...(extra||[]));
    if (warn) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-P'+warn+'D','END:VALARM');
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:PT10H','END:VALARM','END:VEVENT'); };
  events.forEach(e => ev(e.uid, e.date, e.title, e.desc, e.warn || warnDays));
  if (monthly) { const n = new Date(); const first = iso(new Date(n.getFullYear(), n.getMonth()+1, 1)); ev(car().id+'-mileage', first, 'Обновить пробег в Бортжурнале', 'Откройте Бортжурнал и введите пробег, чтобы сроки ТО считались точно.', 0, ['RRULE:FREQ=MONTHLY']); }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function vRemind(){

    <div class="sechead"><h3>Ближайшие события</h3></div>
    ${ev.length ? '<div class="list">' + ev.slice(0,40).map(e => `<article class="card"><div class="row"><div class="title">${esc(e.title)}</div><span class="pill p-none">${esc(dRu(e.date))}</span></div><div class="meta">${esc(e.sub)}</div></article>`).join('') + '</div>' : emptyState('Пока нечего напоминать: отметьте в «Графике ТО», когда делали работы, и укажите сроки документов.')}`;

function remindFile(){
  const c = car(), km = Number(($('#rmKm')||{}).value)||kmPerMonth(c), warn = Math.max(0, Number(($('#rmWarn')||{}).value)||7), monthly = !!($('#rmMonthly')||{}).checked;

  const ics = buildIcs(upcoming(), warn, monthly);

/* ---------- records: pickers ---------- */
function partGroups(){ const ps = parts(), cats = [...new Set(ps.map(p=>p.cat||'Прочее'))];
  return cats.map(c => ({ name:c, items: ps.filter(p=>(p.cat||'Прочее')===c).map(p => ({ id:p.id, label:p.name, sub:isPro() ? [p.oem, p.alt].filter(Boolean).join(' · ') : '', keys:p.note, badge:p.state==='need'?'Купить':p.state==='have'?'Есть':'', badgeCls:p.state==='need'?'p-warn':'p-ok' })) })); }
function pickWork(pre){
  pre = pre || {}; const svc = services(), pid = new Set(parts().map(p=>p.id)), sid = new Set(svc.map(s=>s.id));
  const groups = [{ name:'По графику ТО', items: svc.map(s => { const st = svcStatus(s); return { id:'s:'+s.id, label:s.name, sub:(s.parts||[]).map(findPart).filter(Boolean).map(p=>p.name).join(', '), badge: st.st==='bad'?'Просрочено':st.st==='warn'?'Скоро':'', badgeCls: st.st==='bad'?'p-bad':'p-warn' }; }) }];
  const ok = w => !w.parts.length && !w.svc.length || w.parts.some(p=>pid.has(p)) || w.svc.some(s=>sid.has(s)) || (!w.parts.length && w.svc.length===0);
  const ws = WORKS.filter(w => w.parts.length===0 && w.svc.length===0 ? true : ok(w));
  [...new Set(ws.map(w=>w.group))].forEach(g => groups.push({ name:g, items: ws.filter(w=>w.group===g).map(w => ({ id:'w:'+w.id, label:w.name, sub:w.parts.filter(p=>pid.has(p)).map(findPart).map(p=>p.name).join(', ') })) }));
  picker({ title:'Что сделали?', groups, multi:true, freeLabel:'Записать своими словами', doneLabel:'Далее', onDone:(ids, free) => {
    if (!ids.length && !free) return;
    const sv = new Set(), ps = new Set(), names = []; let cat = '';
    ids.forEach(id => {
      if (id.startsWith('s:')) { const s = findSvc(id.slice(2)); if (!s) return; sv.add(s.id); names.push(s.name); (s.parts||[]).forEach(x=>ps.add(x)); cat = cat || 'ТО'; }
      else { const w = WORKS.find(x=>'w:'+x.id===id); if (!w) return; w.svc.forEach(x=>{ if (sid.has(x)) sv.add(x); }); w.parts.forEach(x=>ps.add(x)); names.push(w.name); cat = cat || (w.group==='Запчасти'?'Запчасти':w.group==='Прочее'?'Прочее':sv.size?'ТО':'Ремонт'); }
    });
    if (free) names.push(free);
    workForm({ ...pre, title:names.join(', '), svcIds:[...sv], parts:[...ps].filter(id=>pid.has(id)), cat: pre.cat || cat || 'Ремонт' });
  }});
}
function partsBox(form, after, list){
  let parts_ = [...list]; const box = document.createElement('div'); box.className = 'field';
  const draw = () => { box.innerHTML = `<label>Запчасти</label>${parts_.length?`<div class="chips">${parts_.map(id=>{ const p = findPart(id); return p?`<span class="chip">${esc(p.name)}${p.oem&&isPro()?` <small>${esc(p.oem)}</small>`:''}<button type="button" data-rm="${esc(id)}" aria-label="Убрать">✕</button></span>`:''; }).join('')}</div>`:''}<button type="button" class="btn" data-addparts="1">＋ Выбрать из каталога</button>`; };
  draw(); form.querySelector(after).closest('.field').after(box);
  box.addEventListener('click', e => { const rm = e.target.closest('[data-rm]'); if (rm) { parts_ = parts_.filter(x=>x!==rm.dataset.rm); draw(); return; }
    if (e.target.closest('[data-addparts]')) picker({ title:'Какие запчасти', groups:partGroups(), multi:true, selected:parts_, onDone: sel => { parts_ = sel; draw(); } }); });
  return () => parts_;
}
const CATS = [['ТО','ТО'],['Ремонт','Ремонт'],['Запчасти','Запчасти'],['Прочее','Прочее']];
function workForm(pre){
  const c = car(), ids = pre.svcIds || []; let getParts;

    if (d.km && d.km > mileage()) { c.mileage = d.km; c.mileageDate = today(); }

/* ---------- import / export ---------- */
async function exportData(){
  const out = { app:'vagjournal', version:1, exported:today(), state:ST, photos:{}, receipts:{} };
  try { for (const k of await IDB.keys()) { const s = String(k); if (s.startsWith('ph_')) out.photos[s.slice(3)] = await IDB.get(k); if (s.startsWith('rc_')) out.receipts[s.slice(3)] = await IDB.get(k); } } catch(e){}
  const name = `bortzhurnal-vag-${today()}.json`, blob = new Blob([JSON.stringify(out)], { type:'application/json' }), file = new File([blob], name, { type:'application/json' });
  const done = async () => { ST.meta.lastBackup = new Date().toISOString(); save(); render(); toast('Копия сохранена'); };
  try { if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return done(); } } catch(e) { if (e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); done();
}
async function importFile(file){
  let j; try { j = JSON.parse(await file.text()); } catch(e) { toast('Это не файл копии'); return; }
  if (!j || j.app!=='vagjournal' || !j.state) { toast('Это не файл копии Бортжурнала'); return; }
  const apply = async () => { const ts = ST.meta.trialStart; Object.assign(ST, { cars:j.state.cars||[], current:j.state.current, meta:j.state.meta||{} }); ST.meta.trialStart = [ts, ST.meta.trialStart].filter(Boolean).sort()[0] || new Date().toISOString();
    for (const [id,v] of Object.entries(j.photos||{})) { photos[id] = v; try { await IDB.set('ph_'+id, v); } catch(e){} }
    for (const [id,v] of Object.entries(j.receipts||{})) { try { await IDB.set('rc_'+id, v); } catch(e){} }
    cache.key = ''; save(); page = 'home'; animate = true; render(); toast('Данные загружены'); };
  if (!ST.cars.length) return apply();
  confirmSheet('Заменить текущие данные?', `Все машины и записи в приложении будут заменены данными из файла${j.exported?` от ${dRu(j.exported)}`:''}.`, 'Заменить', apply);
}

async function loadEquip(file){

  const close = busy('Читаю комплектацию…'); let eq;
  try { eq = EQUIP.parse(await EQUIP.pdfRows(await file.arrayBuffer())); }
  catch(e) { close(); toast(e && e.message==='pdfjs' ? 'Не загрузился модуль чтения PDF. Проверьте интернет и попробуйте ещё раз.' : 'Не удалось прочитать PDF'); return; }
  close();
  if (!eq.vin && !eq.pr.length) { toast('Это не похоже на выписку комплектации ETKA'); return; }
  const r = EQUIP.toCfg(eq);
  if (equipTarget) { const c = ST.cars.find(x=>x.id===equipTarget); equipTarget = null; if (!c) return;
    c.equip = eq; if (!c.vin) c.vin = eq.vin; if (!c.year) c.year = r.year; save();
    const full = r.found.model && r.found.engine && r.found.gearbox, nc = { ...c.cfg, ...r.cfg };
    if (full && JSON.stringify([c.cfg.model,c.cfg.engine,c.cfg.gearbox,c.cfg.drive]) !== JSON.stringify([nc.model,nc.engine,nc.gearbox,nc.drive]))
      confirmSheet('Конфигурация по выписке другая', `По комплектации: ${KB.M[nc.model].name}, ${KB.E[nc.engine].name}, ${KB.G[nc.gearbox].name}, ${nc.drive==='awd'?'полный':'передний'} привод. Применить? Записи сохранятся.`, 'Применить', () => { c.cfg = nc; cache.key = ''; save(); render(); toast('Данные пересчитаны'); });
    cache.key = ''; render(); toast('Комплектация загружена: ' + eq.pr.length + ' PR-кодов'); return; }
  wz = { editId:null, cfg:{ brand:'', model:'', engine:'', gearbox:'', drive:'fwd', air:false, ...r.cfg }, all:false, q:'', equip:eq, found:r.found, driveDone:false, step:'' };
  const c = wz.cfg; wz.all = !!(c.engine && c.model && !KB.M[c.model].engines.includes(c.engine));
  wz.step = !c.model ? (c.brand ? 'model' : 'brand') : !c.engine ? 'engine' : !c.gearbox ? 'gearbox' : (needsDrive() && !r.found.drive) ? 'drive' : 'summary';
  page = 'setup'; animate = true; render(); window.scrollTo({top:0});
  toast(c.model && c.engine && c.gearbox ? 'Комплектация распознана — проверьте' : 'Часть данных не определилась — выберите вручную');

/* ---------- закрытый доступ: приложение открывается только с разрешения владельца ----------
   access.json рядом с приложением: {"open": false, "invites": ["sha256 кода", ...]}.
   open:true — открыто всем. Коды хранятся только в виде хэшей. Нет файла (404) — открыто. */
const ACC_KEY = 'bj_access';
async function codeHash(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s).trim().toUpperCase()));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function accSaved(){ try { return JSON.parse(localStorage.getItem(ACC_KEY) || '{}') || {}; } catch(e) { return {}; } }
async function checkAccess(code){
  const saved = accSaved();
  const q = new URLSearchParams(location.search).get('invite');
  if (code) saved.code = code.trim().toUpperCase(); else if (q) saved.code = q.trim().toUpperCase();
  try {
    const r = await fetch('access.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) saved.ok = true;
    else if (r.ok) { const cfg = await r.json(); saved.ok = !!cfg.open || (!!saved.code && (cfg.invites || []).includes(await codeHash(saved.code))); }
    saved.at = Date.now();
  } catch(e) { /* нет сети: остаётся последний известный ответ */ }
  try { localStorage.setItem(ACC_KEY, JSON.stringify(saved)); } catch(e) {}
  return !!saved.ok;
}

  document.body.classList.add('gated');
  $('#view').innerHTML = `<div class="gate"><img class="gicon" src="icon-180.png" alt="" width="84" height="84"><h1>Бортжурнал скоро откроется</h1>
    <p class="glead">Сейчас приложение доступно только по приглашениям. Если вам дали код, введите его.</p>
    <form class="gcode" id="gcode" autocomplete="off"><input id="gcodeIn" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="Код приглашения" aria-label="Код приглашения">
    <button class="btn big pri" type="submit">Открыть</button></form><p class="gerr" id="gerr" hidden></p>
    ${window.__SITE ? `<a class="glink" href="${window.__SITE}" target="_blank" rel="noopener">Что умеет приложение ›</a>` : ''}</div>`;
  $('#gcode').onsubmit = async e => { e.preventDefault(); const v = $('#gcodeIn').value.trim(), er = $('#gerr');
    if (!v) { er.textContent = 'Введите код.'; er.hidden = false; return; }
    er.hidden = true; const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Проверяем…';
    const ok = await checkAccess(v);
    if (ok) { document.body.classList.remove('gated'); start(); }
    else { b.disabled = false; b.textContent = 'Открыть'; er.textContent = navigator.onLine === false ? 'Нет интернета. Подключитесь и попробуйте ещё раз.' : 'Код не подошёл. Проверьте, нет ли опечатки.'; er.hidden = false; } };
}

  let body;

    <ol class="gsteps"><li>Нажмите меню ${dots} в правом верхнем углу Chrome</li><li>Выберите «Установить приложение» или «Добавить на главный экран»</li><li>Откройте Бортжурнал с иконки на рабочем столе</li></ol>`;
  else body = `<div class="gstep"><p>Бортжурнал — приложение для телефона. Откройте эту ссылку на iPhone (в Safari) или Android (в Chrome) и установите его на главный экран.</p><div class="gurl"><code>${esc(location.href.split('#')[0])}</code><button class="btn" data-gate="copy">Скопировать</button></div></div>`;
  document.body.classList.add('gated');

    <p class="glead">Приложение работает после установки на телефон: так оно открывается без интернета, а данные надёжно хранятся на устройстве.</p>
    ${body}<p class="gdone" id="gateDone" hidden>Готово — откройте Бортжурнал с иконки на главном экране.</p>
    ${window.__SITE ? `<a class="glink" href="${window.__SITE}" target="_blank" rel="noopener">Что умеет приложение ›</a>` : ''}</div>`;
  $('#view').onclick = async e => { const b = e.target.closest('[data-gate]'); if (!b) return;
    if (b.dataset.gate === 'copy') { try { await navigator.clipboard.writeText(location.href.split('#')[0]); b.textContent = 'Скопировано'; } catch (err) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); } }
    if (b.dataset.gate === 'install' && deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (err) {} deferredInstall = null; b.hidden = true; } };
}
